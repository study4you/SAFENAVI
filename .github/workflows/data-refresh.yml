name: Refresh SafeNavi road-safety data

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: safenavi-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh public road-safety data
        run: python scripts/refresh_enforcement_osm.py

      - name: Commit changed data only
        run: |
          if git diff --quiet -- data/enforcement; then
            echo "No road-safety data changes."
            exit 0
          fi
          git config user.name "SafeNavi Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/enforcement
          git commit -m "Update SafeNavi road-safety data"
          git push

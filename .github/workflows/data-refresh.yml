name: Refresh SafeNavi safety data

on:
  workflow_dispatch:
  schedule:
    - cron: "20 18 * * *"
  push:
    branches: [ "main" ]
    paths:
      - "scripts/refresh_enforcement_osm.py"
      - ".github/workflows/data-refresh.yml"

permissions:
  contents: write

concurrency:
  group: safenavi-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh public safety data
        run: python scripts/refresh_enforcement_osm.py

      - name: Commit changed data only
        run: |
          if git diff --quiet -- data/enforcement; then
            echo "No safety-data changes."
            exit 0
          fi
          git config user.name "SafeNavi Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/enforcement
          git commit -m "Update SafeNavi public safety data"
          git push
